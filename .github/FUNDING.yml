# GitHub funding configuration
# https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# Uncomment and fill in any platforms you've set up. You can have
# multiple — GitHub shows them all in the Sponsor dropdown.
#
# The Sponsor button appears at the top right of the repo page once
# at least one of these is configured.

# GitHub Sponsors (preferred — zero platform fees, GitHub native)
# Requires: register at https://github.com/sponsors
# github: YOUR_USERNAME

# Buy Me a Coffee (easy one-time donations)
# Requires: account at https://www.buymeacoffee.com/
# custom: ["https://buymeacoffee.com/YOUR_USERNAME"]

# Ko-fi (alternative to Buy Me a Coffee)
# ko_fi: YOUR_USERNAME

# Patreon (recurring memberships)
# patreon: YOUR_USERNAME

# Open Collective (transparent group funding)
# open_collective: filegraph3d

# Liberapay (open-source friendly, EU-based)
# liberapay: YOUR_USERNAME

# Tidelift (for businesses paying for open-source maintenance)
# tidelift: npm/filegraph3d

# Polar (modern sponsorship + paid issues)
# polar: YOUR_USERNAME

# Custom URLs — your own donation page, BTC address, etc.
# custom:
#   - "https://your-site.com/donate"
#   - "https://github.com/YOUR_USER/filegraph3d#sponsor"
