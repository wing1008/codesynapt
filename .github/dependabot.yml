# Dependabot configuration for CodeSynapt
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Schedule strategy:
#   - Weekly checks on Monday morning (low-traffic time)
#   - Patch + minor updates grouped into a single PR per ecosystem
#   - Major updates get individual PRs (need careful review)
#   - Hard limit of 5 open PRs per ecosystem to prevent overload

version: 2

updates:
  # ─── Main app dependencies ──────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - needs-triage
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      # Babel ecosystem moves together
      babel:
        patterns:
          - '@babel/*'
      # Patch and minor updates rolled into one weekly PR
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@babel/*'
    ignore:
      # Electron major bumps require manual review (breaking API changes,
      # entitlement updates, mac signing implications). Patch and minor
      # bumps are fine and stay enabled.
      - dependency-name: electron
        update-types:
          - version-update:semver-major
      # electron-builder major bumps similarly affect packaging output
      - dependency-name: electron-builder
        update-types:
          - version-update:semver-major
      # Three.js minor bumps can change shader behavior — review manually
      - dependency-name: three
        update-types:
          - version-update:semver-major

  # ─── Plugin API package (tracked separately) ────────────
  - package-ecosystem: npm
    directory: /plugin-api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - plugin-api
      - needs-triage
    commit-message:
      prefix: 'chore(plugin-api/deps)'

  # ─── GitHub Actions own updates ─────────────────────────
  # Keeps actions/checkout, actions/setup-node etc. current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
