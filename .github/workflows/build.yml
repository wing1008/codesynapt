name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # electron-builder creates a GitHub Release + uploads the installers
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run dist:mac
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npm run dist:win
          else
            npm run dist:linux
          fi
        shell: bash

      # Software Bill of Materials (CycloneDX). Helps enterprise consumers
      # track every dependency + license + known-CVE status. Generated once
      # per release (Linux runner only — output is platform-independent).
      #
      # Runs AFTER "Build app" so that dist/ already exists: electron-builder
      # creates dist/ during the build, and this step moves the SBOM into it
      # for the release-attach step. (Previously this ran before the build,
      # so `mv … dist/…` failed with "No such file or directory" and the
      # Linux release job errored out, dropping the SBOM from the release.)
      # The `mkdir -p dist` guard makes the move order-independent and robust
      # even if a future build target leaves dist/ absent.
      - name: Generate SBOM (CycloneDX)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cyclonedx.json
          echo "=== SBOM size: $(wc -c < sbom.cyclonedx.json) bytes ==="
          # Move into dist/ so the release-attach step picks it up.
          mkdir -p dist
          mv sbom.cyclonedx.json dist/sbom.cyclonedx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codesynapt-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: ignore

      # Generate SHA-256 hashes for every built artifact so users can
      # verify their download matches what CI built. The hashes are
      # embedded in the release notes automatically.
      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          # Find every distributable artifact, hash it, write a single
          # SHA256SUMS-<os>.txt file alongside.
          find . -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.tar.gz' -o -name '*.zip' \
          \) | while read -r f; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f"
            elif command -v shasum >/dev/null; then
              shasum -a 256 "$f"
            else
              certutil -hashfile "$f" SHA256
            fi
          done > "SHA256SUMS-${RUNNER_OS}.txt"
          echo "=== Hashes ==="
          cat "SHA256SUMS-${RUNNER_OS}.txt"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
            dist/sbom.cyclonedx.json
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
