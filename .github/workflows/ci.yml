name: ci

# Runs on every push to main and every PR.
# Lightweight checks only — full builds happen on tag push (build.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new push lands on the same PR/branch.
# Saves CI minutes and gives faster feedback on the latest code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint and syntax check (fast, runs first) ───────────
  lint:
    name: Syntax & license
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (main app)
        run: |
          node --check public/app.js
          node --check public/plugin-host.js
          node --check public/backend.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/plugin-loader.cjs
          node --check scanner.js
          node --check parser.js
          node --check server.js
          node --check test.js
          node --check perf-test.js

      - name: Syntax check (example plugins)
        run: |
          node --check plugin-api/examples/hello-world-plugin/main.js
          node --check plugin-api/examples/mermaid-exporter/main.js
          node --check plugin-api/examples/rust-parser/main.js

      - name: License compliance
        run: npm run license-check

  # ─── Parser smoke test (cross-OS) ───────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run parser test
        run: node test.js

  # ─── Markdown link check ────────────────────────────────
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verify markdown cross-references
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          errors = []
          for root, dirs, files in os.walk('.'):
              if 'node_modules' in root or 'dist' in root or '.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fp:
                      content = fp.read()
                  links = re.findall(r'\]\((?!https?://|#|mailto:)([^)]+)\)', content)
                  for link in links:
                      target = link.split('#')[0].split('?')[0]
                      if not target:
                          continue
                      base = os.path.dirname(path)
                      full = os.path.normpath(os.path.join(base, target))
                      if not os.path.exists(full):
                          errors.append(f'  {path}: link `{link}` → not found')

          if errors:
              print(f'❌ {len(errors)} broken markdown links:')
              for e in errors[:30]:
                  print(e)
              sys.exit(1)
          else:
              print('✅ All markdown cross-references resolve')
          PYEOF
