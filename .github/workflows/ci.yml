name: ci

# Runs on every push to main and every PR.
# Lightweight checks only — full builds happen on tag push (build.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new push lands on the same PR/branch.
# Saves CI minutes and gives faster feedback on the latest code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint and syntax check (fast, runs first) ───────────
  lint:
    name: Syntax & license
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (main app)
        run: |
          node --check public/app.js
          node --check public/plugin-host.js
          node --check public/backend.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/plugin-loader.cjs
          node --check packages/core/scanner.js
          node --check packages/core/parser.js
          node --check server.js
          node --check test.js
          node --check scripts/perf-test.js

      - name: Syntax check (example plugins)
        run: |
          node --check plugin-api/examples/hello-world-plugin/main.js
          node --check plugin-api/examples/mermaid-exporter/main.js
          node --check plugin-api/examples/rust-parser/main.js

      - name: License compliance
        run: npm run license-check

  # ─── Cross-OS / cross-Node test matrix ───────────────────
  test:
    name: Test (${{ matrix.os }} · Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (skip optional + dev)
        # Validates the "CLI/MCP only" install path
        run: npm ci --omit=optional --omit=dev

      - name: Smoke test (parser + scanner)
        run: node test.js

      - name: Install dev deps for vitest
        run: npm install --no-save vitest@^2.0.0

      - name: Run vitest suite
        run: npx vitest run

  # ─── Installed-tarball smoke (hoisted layout) ───────────
  # The dev-repo test suite runs against the repo's own node_modules, where
  # the grammar wasm happens to sit at the same path the (now-fixed) hard-coded
  # lookup used — so it CANNOT catch a packaging/path regression that only
  # surfaces once installed. insp-004: every tree-sitter language was silently
  # dead in npm installs (coverage still 100%) while the suite stayed green.
  # This job packs the tarball, installs it into a throwaway project (real npm
  # hoisting), and proves py/java/c# Layer-2 actually parses from there — plus
  # checks the tarball ships pytracer.py and leaks no .codesynapt/test data.
  install-smoke:
    name: Installed-tarball smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack tarball
        run: npm pack

      - name: Tarball contents — ship pytracer, leak nothing
        shell: bash
        run: |
          TGZ=$(ls codesynapt-*.tgz)
          echo "packed: $TGZ"
          if tar -tzf "$TGZ" | grep -E '(^|/)\.codesynapt/|\.test\.cjs$|observed-edges|recall-suspects'; then
            echo "❌ tarball leaks data/test files"; exit 1
          fi
          tar -tzf "$TGZ" | grep -q 'packages/core/lib/pytracer.py' || { echo "❌ pytracer.py missing from tarball"; exit 1; }
          echo "✅ tarball contents OK"

      - name: Install into a throwaway project (real hoisting)
        shell: bash
        run: |
          TGZ="$GITHUB_WORKSPACE/$(ls codesynapt-*.tgz)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$TGZ"

      - name: Layer-2 alive from the installed copy
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/scripts/ci-install-smoke.mjs" "$RUNNER_TEMP/smoke/node_modules/codesynapt"

  # ─── Blast-radius PR comment ────────────────────────────
  # Wires in the composite Action at .github/actions/blast-radius,
  # which was previously shipped but never invoked by any workflow —
  # a dead CI path, so regressions in the ci-diff / ci-gate pipeline
  # went undetected. This job exercises it on every PR: it diffs
  # base..head, computes the dependency blast radius of the changed
  # files, and posts/updates a single Markdown comment on the PR.
  #
  # Non-blocking by design (max-blast/max-changed left at the Action's
  # default of 0 = no gate) so it informs reviewers without failing
  # the PR. Flip those inputs to a positive number to turn it into a
  # hard gate later.
  blast-radius:
    name: Blast radius
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on PRs (needs base/head + a PR to comment on).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head diff can resolve both refs.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Compute blast radius and comment
        uses: ./.github/actions/blast-radius
        with:
          depth: '3'
          comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Markdown link check ────────────────────────────────
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verify markdown cross-references
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          errors = []
          for root, dirs, files in os.walk('.'):
              if 'node_modules' in root or 'dist' in root or '.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fp:
                      content = fp.read()
                  links = re.findall(r'\]\((?!https?://|#|mailto:)([^)]+)\)', content)
                  for link in links:
                      target = link.split('#')[0].split('?')[0]
                      if not target:
                          continue
                      base = os.path.dirname(path)
                      full = os.path.normpath(os.path.join(base, target))
                      if not os.path.exists(full):
                          errors.append(f'  {path}: link `{link}` → not found')

          if errors:
              print(f'❌ {len(errors)} broken markdown links:')
              for e in errors[:30]:
                  print(e)
              sys.exit(1)
          else:
              print('✅ All markdown cross-references resolve')
          PYEOF
